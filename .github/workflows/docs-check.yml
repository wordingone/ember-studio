name: docs-check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links, media and refusals
        run: python scripts/check_docs.py .
      - name: The check fails on deliberately broken trees
        run: python scripts/test_check_docs.py
