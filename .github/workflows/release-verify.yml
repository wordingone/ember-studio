name: release-verify

# Nothing is built here. A release is built privately and published on this repository's Releases page as files with
# a SHA256SUMS.txt. This workflow downloads the published files of a release and verifies them: checksums, no folder
# name of the build machine inside a program, and the Studio program is a GUI program. It needs no secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          mkdir release-files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-files
          ls -l release-files
      - name: Verify
        run: python checks/verify_release.py release-files
